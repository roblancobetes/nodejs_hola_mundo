apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodejs-app
spec:
  ingressClassName: nginx
  rules:
    - host: nodejs.midominio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nodejs-app
                port:
                  number: 80
